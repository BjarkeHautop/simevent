url: https://github.com/miclukacova/simevent
template:
  bootstrap: 5
  math-rendering: katex

reference:
- title: Package overview
  desc: >
    Overview of the simevent package.
  contents:
  - simevent-package

- title: Core simulation
  desc: >
    Functions for simulating event history data, built on the general-purpose
    simEventData/simEventTV engine.
  contents:
  - simEventData
  - simEventTV
  - simEventDataTdPhi
  - sim.generic

- title: Preset wrappers (old)
  desc: >
    Ready-made wrappers for common settings, each hard-coding a fixed
    baseline/process/effect specification on top of simEventData(). These
    predate sim.generic() and are kept for backward compatibility, but
    sim.generic() can reproduce any of them (and more) from a single general
    interface --- see `vignette("sim-generic")`.
  contents:
  - simSurvData
  - simCRdata
  - simDisease
  - simTreatment
  - simDropIn
  - simStatinData

- title: Treating simulated data
  desc: >
    Functions for formatting and plotting simulated event history data.
  contents:
  - IntFormatData
  - plotEventData

- title: Simulating from fitted models
  desc: >
    Functions for simulating new data from models fitted to observed data.
  contents:
  - simEventCox
  - simEventObj
  - sim.from.data

- title: Interventions
  desc: >
    Functions for performing interventions on the shape parameter of a process,
    and estimating their effect.
  contents:
  - alphaSim
  - intEffectAlpha

