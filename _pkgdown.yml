url: https://github.com/BjarkeHautop/simevent
template:
  bootstrap: 5
  math-rendering: katex

reference:
- title: Package overview
  desc: >
    Overview of the simevent package.
  contents:
  - simevent-package

- title: Simulation
  desc: >
    Build a simulation model of covariates, event processes, and
    effects between them, and simulate event history data from it.
  contents:
  - sim_model
  - sim_covariate
  - sim_derived
  - sim_mark
  - sim_process
  - sim_effect
  - event_time
  - simulate_events
  - sim_model_from_fits
  - summary.sim_model
  - update.sim_model

- title: Treating simulated data
  desc: >
    Functions for formatting, plotting, and summarising data simulated with
    `simulate_events()`.
  contents:
  - format_interval_data
  - plot_event_data
  - event_risk
