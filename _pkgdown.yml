url: https://github.com/miclukacova/simevent
template:
  bootstrap: 5
  math-rendering: katex

reference:
- title: Package overview
  desc: >
    Overview of the simevent package.
  contents:
  - simevent-package

- title: Graph-based simulation
  desc: >
    Build a simulation spec as a graph of covariates, event processes, and
    effects between them, and simulate event history data from it.
  contents:
  - sim_graph
  - sim_covariate
  - sim_derived
  - sim_process
  - sim_effect
  - sim_event_graph
  - sim_graph_from_fits

- title: Treating graph-based simulated data
  desc: >
    Functions for formatting, plotting, and summarising data simulated with
    `sim_event_graph()`.
  contents:
  - interval_format_data
  - plot_event_data
  - event_risk

- title: Core simulation (old)
  desc: >
    Functions for simulating event history data, built on the old
    simEventData/simEventTV engine. Will be removed in the future.
  contents:
  - simEventData
  - simEventTV
  - simEventDataTdPhi
  - sim.generic

- title: Preset wrappers (old)
  desc: >
    Ready-made wrappers for common settings, each hard-coding a fixed
    baseline/process/effect specification on top of simEventData(). Will
    be removed in the future.
  contents:
  - simSurvData
  - simCRdata
  - simDisease
  - simTreatment
  - simDropIn
  - simStatinData

- title: Treating simulated data (old)
  desc: >
    Functions for formatting and plotting event history data simulated with
    the old engine. Will be removed in the future.
  contents:
  - IntFormatData
  - plotEventData

- title: Simulating from fitted models (old)
  desc: >
    Functions for simulating new data from models fitted to observed data,
    built on the old engine. Will be removed in the future.
  contents:
  - simEventCox
  - simEventObj
  - sim.from.data

- title: Interventions (old)
  desc: >
    Functions for performing interventions on the shape parameter of a process,
    and estimating their effect. Will be removed in the future.
  contents:
  - alphaSim
  - intEffectAlpha

